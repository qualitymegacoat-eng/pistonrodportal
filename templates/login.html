<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#002244,#004080);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:white;
            width:380px;
            padding:35px;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
            text-align:center;
        }

        .login-box img{
            width:150px;
            margin-bottom:20px;
        }

        h2{
            color:#003366;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:13px;
            margin-bottom:18px;
            border:2px solid #d0d7e2;
            border-radius:10px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:13px;
            background:#003366;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#0055aa;
        }

        .error{
            color:red;
            font-weight:bold;
            margin-bottom:15px;
        }

        .back{
            display:block;
            margin-top:18px;
            color:#003366;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">

    <h2>Admin Login</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">Login</button>

    </form>

    <a href="/" class="back">← Back To Portal</a>

</div>

</body>
</html>
